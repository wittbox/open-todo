# One container: the app and its PostgreSQL, with everything that must survive a rebuild under ./data.
#
#   cp .env.example .env   # APP_BASE_URL is the only value you have to set
#   docker compose up -d --build
#
# Put an HTTPS reverse proxy (Caddy, nginx, …) in front of port ${APP_PORT:-3000} and set
# TRUST_PROXY=1 so rate limits see the visitor's address. See README.md for a worked example.

services:
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL in .env}
      # Leave empty and one is generated on first boot and kept in ./data/secrets.
      SESSION_SECRET: ${SESSION_SECRET:-}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      APP_NAME: ${APP_NAME:-}
      # Defaults for people who haven't chosen in settings.
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-}
      APP_TZ: ${APP_TZ:-}
      HOLIDAY_REGION: ${HOLIDAY_REGION:-}
      # 1 when a reverse proxy sits in front, so X-Forwarded-For is trusted for rate limits.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Mail
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MOCK_MAIL: ${MOCK_MAIL:-}
      REPORT_MAIL_MAX_RECIPIENTS: ${REPORT_MAIL_MAX_RECIPIENTS:-}
      REPORT_MAIL_DAILY_LIMIT: ${REPORT_MAIL_DAILY_LIMIT:-}
      # Sign in with Google. The button shows up only when both values are set.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Scheduled jobs run inside the container. Set RUN_JOBS=0 and a CRON_KEY to drive them from outside.
      RUN_JOBS: ${RUN_JOBS:-}
      CRON_KEY: ${CRON_KEY:-}
    volumes:
      # The database, the attachments and the generated secrets.
      - ./data:/data
    ports:
      - "${APP_PORT:-3000}:3000"
    # Docker gives a container 64 MB of /dev/shm; PostgreSQL wants more room than that.
    shm_size: 256mb
    # Shutting down flushes the database. Don't cut it off after the default 10 seconds.
    stop_grace_period: 60s
