name: Idea
description: Something the app should be able to do
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation you are in, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How you handle it today
      description: What you do instead, and where that falls down.

  - type: textarea
    id: idea
    attributes:
      label: What you'd like
