name: Bug report
description: Something works differently than it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems don't belong here — see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        1. Published a weekly report
        2. Clicked "Send email"
        3. …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: A release tag or a commit hash.
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How it runs
      options:
        - docker compose
        - Node, built from source
        - Development server (npm run dev)
        - Something else
    validations:
      required: true

  - type: input
    id: locale
    attributes:
      label: Language and time zone
      description: If a date, a time or a translation is involved, this is usually the answer.
      placeholder: ko · Asia/Seoul

  - type: textarea
    id: logs
    attributes:
      label: Server log
      description: Anything the app printed around the time it went wrong. Remove addresses and tokens first.
      render: text
